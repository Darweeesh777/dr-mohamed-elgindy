<fieldset class="field choice-group{% if field.errors %} field--error{% endif %}"{% if field.errors %} aria-describedby="{{ field.auto_id }}_error"{% endif %}>
  <legend class="field__label">{{ field.label }}<span class="field__req" aria-hidden="true">*</span></legend>
  <div class="choice-group__options">
    {% for radio in field %}
    <label class="choice" for="{{ radio.id_for_label }}">{{ radio.tag }}<span>{{ radio.choice_label }}</span></label>
    {% endfor %}
  </div>
  {% if field.errors %}<p class="field__error" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</p>{% endif %}
</fieldset>
