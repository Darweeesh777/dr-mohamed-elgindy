<div class="field{% if field.errors %} field--error{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="field__req" aria-hidden="true">*</span>{% else %} <span class="field__optional">({{ t.form.optional }})</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="field__error" id="{{ field.auto_id }}_error">{{ field.errors|join:" " }}</p>{% endif %}
</div>
